<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="770" viewBox="0 0 1500 770" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif'>
<rect width="1500" height="770" fill="#ffffff"/>
<text x="750.0" y="46" text-anchor="middle" font-size="21" font-weight="700" fill="#282828">KIẾN TRÚC QUY TRÌNH NGHIỆP VỤ MẢNG ĐẶT VÉ MÁY BAY TRÊN MOMO</text>
<text x="750.0" y="74" text-anchor="middle" font-size="14" fill="#5a5a5a">10 quy trình — 4 Quản lý · 3 Cốt lõi · 3 Hỗ trợ</text>
<text x="42" y="410" font-size="13" font-weight="600" fill="#5a5a5a" transform="rotate(-90 42 410)" text-anchor="middle">NHU CẦU KHÁCH HÀNG</text>
<text x="1458" y="410" font-size="13" font-weight="600" fill="#5a5a5a" transform="rotate(90 1458 410)" text-anchor="middle">VÉ MÁY BAY &amp; DỊCH VỤ</text>
<rect x="96" y="110" width="1308" height="174" rx="10" fill="#e8eef7" stroke="#4a6fa5" stroke-width="2"/>
<text x="118" y="142" font-size="15" font-weight="700" fill="#4a6fa5">QUY TRÌNH QUẢN LÝ (Management Process)</text>
<rect x="118" y="158" width="302.5" height="96" rx="8" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="269.25" y="206.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" fill="#282828">Quản lý hạng vé</text>
<rect x="438.5" y="158" width="302.5" height="96" rx="8" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="589.75" y="197.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" fill="#282828">Quản trị giá, khuyến mãi</text>
<text x="589.75" y="215.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" fill="#282828">và chính sách hiển thị giá</text>
<rect x="759.0" y="158" width="302.5" height="96" rx="8" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="910.25" y="197.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" fill="#282828">Quản trị danh mục hãng bay</text>
<text x="910.25" y="215.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" fill="#282828">và đối tác nhà cung ứng</text>
<rect x="1079.5" y="158" width="302.5" height="96" rx="8" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="1230.75" y="197.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" fill="#282828">Quản trị rủi ro giao dịch,</text>
<text x="1230.75" y="215.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" fill="#282828">điều khoản và chất lượng DV</text>
<rect x="96" y="310" width="1308" height="174" rx="10" fill="#e6f4ea" stroke="#3d7a52" stroke-width="2"/>
<text x="118" y="342" font-size="15" font-weight="700" fill="#3d7a52">QUY TRÌNH CỐT LÕI (Core Process)</text>
<rect x="118" y="358" width="409.3333333333333" height="96" rx="8" fill="#ffffff" stroke="#3d7a52" stroke-width="1.6"/>
<text x="322.66666666666663" y="397.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" fill="#282828">Tìm kiếm, lựa chọn hành trình,</text>
<text x="322.66666666666663" y="415.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" fill="#282828">thanh toán và xác nhận đặt vé</text>
<rect x="545.3333333333333" y="358" width="409.3333333333333" height="96" rx="8" fill="#ffffff" stroke="#3d7a52" stroke-width="1.6"/>
<text x="749.9999999999999" y="397.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" fill="#282828">Mua thêm dịch vụ</text>
<text x="749.9999999999999" y="415.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" fill="#282828">sau đặt chỗ</text>
<rect x="972.6666666666665" y="358" width="409.3333333333333" height="96" rx="8" fill="#ffffff" stroke="#3d7a52" stroke-width="1.6"/>
<text x="1177.3333333333333" y="406.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" fill="#282828">Đổi chuyến bay</text>
<rect x="96" y="510" width="1308" height="174" rx="10" fill="#fdf0e3" stroke="#a86a2e" stroke-width="2"/>
<text x="118" y="542" font-size="15" font-weight="700" fill="#a86a2e">QUY TRÌNH HỖ TRỢ (Support Process)</text>
<rect x="118" y="558" width="409.3333333333333" height="96" rx="8" fill="#ffffff" stroke="#a86a2e" stroke-width="1.6"/>
<text x="322.66666666666663" y="597.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" fill="#282828">Hỗ trợ khách hàng</text>
<text x="322.66666666666663" y="615.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" fill="#282828">và tiếp nhận phản hồi</text>
<rect x="545.3333333333333" y="558" width="409.3333333333333" height="96" rx="8" fill="#ffffff" stroke="#a86a2e" stroke-width="1.6"/>
<text x="749.9999999999999" y="606.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" fill="#282828">Xuất hóa đơn điện tử (VAT)</text>
<rect x="972.6666666666665" y="558" width="409.3333333333333" height="96" rx="8" fill="#ffffff" stroke="#a86a2e" stroke-width="1.6"/>
<text x="1177.3333333333333" y="606.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" fill="#282828">Quản lý vé đã mua</text>
<text x="96" y="734" font-size="12.5" fill="#5a5a5a">Ghi chú: 6 quy trình được mô hình hóa chi tiết bằng BPMN 2.0 ở Chương 3; 3 quy trình được phân tích định tính và định lượng ở Chương 4.</text>
</svg>